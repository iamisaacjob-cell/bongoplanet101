<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BongoPlanet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23C9A24B'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--night:#0C1E22;--tanz:#5B4B9A;--gold:#C9A24B;--pearl:#F4F1EC;--mist:#A9B8B6;--serif:"Cormorant Garamond",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--pearl);color:var(--night);font:400 1.12rem/1.8 Jost,system-ui,sans-serif}
a{color:var(--tanz)}
.head{background:radial-gradient(120% 90% at 80% 0%,#2B2358,var(--night) 65%);color:var(--pearl);padding:1.5rem 0 3.5rem}
.w{max-width:44rem;margin:0 auto;padding:0 1.5rem}
.logo{font:600 1.6rem var(--serif);text-decoration:none;color:var(--pearl)}.logo i{color:var(--gold)}
.head small{display:block;margin:3rem 0 .6rem;font:italic 500 1.3rem var(--serif);color:var(--gold)}
h1{font:500 clamp(2.6rem,8vw,4.6rem)/1.02 var(--serif);margin:0 0 1rem}
.meta{color:var(--mist);font-size:.95rem}
article{padding:2.5rem 0 3rem}
article img{max-width:100%;height:auto;display:block;margin:1.5rem 0}
article h2,article h3,article h4{font-family:var(--serif);font-weight:500;line-height:1.1;margin:2rem 0 .5rem;color:var(--tanz)}
article h2{font-size:2.4rem}article h3{font-size:1.9rem}
article p,article ul{margin:0 0 1.3rem}
footer{padding:0 0 3rem;font-size:.95rem;color:#4A5B5C}
</style></head>
<body>
<header class="head"><div class="w"><a class="logo" href="/">Bongo<i>Planet</i></a><small id="cat"></small><h1 id="ttl">Loading…</h1><div class="meta" id="meta"></div></div></header>
<main class="w"><article id="body"></article></main>
<footer><div class="w"><a href="/">Back to home</a></div></footer>
<script>
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function inl(s){return s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1">').replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:|\/)[^)\s]+)\)/g,'<a href="$2" rel="noopener">$1</a>').replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>")}
function md(s){var o=[];esc(s).split(/\n{2,}/).forEach(function(b){b=b.trim();if(!b)return;var m=b.match(/^(#{1,3})\s+(.*)/);if(m){var n=m[1].length+1;o.push("<h"+n+">"+inl(m[2])+"</h"+n+">");return}if(/^[-*]\s/.test(b)){o.push("<ul>"+b.split(/\n/).map(function(l){return "<li>"+inl(l.replace(/^[-*]\s+/,""))+"</li>"}).join("")+"</ul>");return}o.push("<p>"+inl(b).replace(/\n/g,"<br>")+"</p>")});return o.join("")}
var slug=new URLSearchParams(location.search).get("p");
fetch("posts.json").then(function(r){return r.json()}).then(function(j){
var p=(j.posts||[]).filter(function(x){return x.slug===slug})[0];
if(!p){document.getElementById("ttl").textContent="Story not found";document.getElementById("body").innerHTML='<p>We could not find that story. <a href="/">Go back home</a>.</p>';return}
document.title=p.title+" | BongoPlanet";
document.getElementById("ttl").textContent=p.title;
document.getElementById("cat").textContent=p.category||"";
document.getElementById("meta").textContent="By the BongoPlanet editors · "+new Date(p.date).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
document.getElementById("body").innerHTML=(p.image?'<img src="'+esc(p.image)+'" alt="">':"")+md(p.body||"");
}).catch(function(){document.getElementById("ttl").textContent="Story not found"});
</script></body></html>
